<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 641" role="img" aria-labelledby="title desc">
  <title id="title">NicaSalud portada</title>
  <desc id="desc">Banner institucional de NicaSalud con emblema botánico, nombre y lema sobre salud y bienestar en Nicaragua.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051019"/>
      <stop offset="100%" stop-color="#0a1f2a"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#155b70"/>
      <stop offset="52%" stop-color="#16b4b3"/>
      <stop offset="100%" stop-color="#74d93c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0a2230" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="641" fill="url(#bg)"/>
  <circle cx="250" cy="110" r="170" fill="#1eb7b2" opacity=".10"/>
  <circle cx="1370" cy="165" r="210" fill="#67d84b" opacity=".08"/>
  <circle cx="1210" cy="520" r="240" fill="#17a9db" opacity=".06"/>

  <g filter="url(#softShadow)">
    <rect x="82" y="126" width="372" height="372" rx="72" fill="#12366a"/>
  </g>

  <g transform="translate(156 185)">
    <circle cx="112" cy="72" r="84" fill="none" stroke="#f9f2df" stroke-width="10"/>
    <circle cx="112" cy="72" r="77" fill="none" stroke="#d5c39c" stroke-width="3" opacity=".65"/>
    <path d="M96 142 C110 115 128 92 154 68" fill="none" stroke="#d8b86c" stroke-width="5" stroke-linecap="round"/>
    <g fill="#d8b86c" stroke="#eddcb1" stroke-width="2">
      <ellipse cx="75" cy="63" rx="10" ry="6" transform="rotate(-34 75 63)"/>
      <ellipse cx="90" cy="47" rx="10" ry="6" transform="rotate(-22 90 47)"/>
      <ellipse cx="107" cy="38" rx="10" ry="6" transform="rotate(-10 107 38)"/>
      <ellipse cx="127" cy="34" rx="10" ry="6" transform="rotate(12 127 34)"/>
      <ellipse cx="143" cy="41" rx="10" ry="6" transform="rotate(24 143 41)"/>
      <ellipse cx="156" cy="52" rx="10" ry="6" transform="rotate(38 156 52)"/>
      <ellipse cx="69" cy="83" rx="10" ry="6" transform="rotate(-18 69 83)"/>
      <ellipse cx="85" cy="93" rx="10" ry="6" transform="rotate(-8 85 93)"/>
      <ellipse cx="104" cy="103" rx="10" ry="6" transform="rotate(8 104 103)"/>
      <ellipse cx="123" cy="108" rx="10" ry="6" transform="rotate(20 123 108)"/>
      <ellipse cx="141" cy="106" rx="10" ry="6" transform="rotate(34 141 106)"/>
    </g>
    <text x="112" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#f3f8fb">NicaSalud</text>
    <text x="112" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e8f7f3" letter-spacing="2">SALUD COMUNITARIA</text>
    <text x="112" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e8f7f3" letter-spacing="1">NICARAGUENSE</text>
    <rect x="89" y="274" width="46" height="30" rx="2" fill="#ffffff" opacity=".95"/>
    <rect x="89" y="274" width="46" height="10" fill="#4f77d6"/>
    <rect x="89" y="294" width="46" height="10" fill="#4f77d6"/>
    <circle cx="112" cy="289" r="9" fill="#f4d76f" opacity=".9"/>
  </g>

  <g transform="translate(520 150)">
    <text x="0" y="170" font-family="Segoe UI Black, Arial Black, sans-serif" font-size="164" font-weight="900" fill="url(#wordmark)" letter-spacing="-1">NICASALUD</text>
    <text x="8" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#dffcf0" letter-spacing="1.6">ORGANIZACION PARA LA SALUD Y EL BIENESTAR EN NICARAGUA</text>
  </g>
